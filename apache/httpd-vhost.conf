<VirtualHost *:80>

    ServerName app-gestion.empresa.local

    DocumentRoot "/usr/local/apache2/htdocs"


    <Directory "/usr/local/apache2/htdocs">
        Require all granted
        Options -Indexes
        AllowOverride None
    </Directory>


    <Location "/privado/">
        Require expr "%{HTTP:X-Auth-Token} == 'DAW2026'"
    </Location>


    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12


    LogFormat "%a %l %u %t \"%r\" %>s %b" realip

    CustomLog "/usr/local/apache2/logs/access_log" realip

    ErrorLog "/usr/local/apache2/logs/error_log"

</VirtualHost>
