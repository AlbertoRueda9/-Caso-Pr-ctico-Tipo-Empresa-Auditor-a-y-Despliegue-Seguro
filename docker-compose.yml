services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - apache
    networks:
      - red

  apache:
    build: ./apache
    container_name: apache
    volumes:
      - ./apache/htdocs:/usr/local/apache2/htdocs:ro
    networks:
      - red

networks:
  red:
    driver: bridge